<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="https://allinadvertising.com/wp-content/uploads/2024/06/cropped-aia-favicon-32x32.png" sizes="32x32">
<link rel="icon" href="https://allinadvertising.com/wp-content/uploads/2024/06/cropped-aia-favicon-192x192.png" sizes="192x192">
<link rel="apple-touch-icon" href="https://allinadvertising.com/wp-content/uploads/2024/06/cropped-aia-favicon-180x180.png">
<meta name="msapplication-TileImage" content="https://allinadvertising.com/wp-content/uploads/2024/06/cropped-aia-favicon-270x270.png">
<title>Content Services Decks | All In Advertising</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --brand-blue: #3e71b8;
    --brand-blue-dark: #2c5592;
    --brand-gold: #f6b328;
    --gray-50: #f9fafb;
    --gray-100: #f3f4f6;
    --gray-200: #e5e7eb;
    --gray-500: #6b7280;
    --gray-700: #374151;
    --gray-800: #1f2937;
    --gray-900: #111827;
    --white: #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    font-family: 'Roboto', system-ui, -apple-system, sans-serif;
    color: var(--gray-800);
    background: #f5f7fb;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  main {
    width: min(1080px, calc(100% - 40px));
    margin: 0 auto;
    padding: 64px 0;
  }

  header {
    margin-bottom: 34px;
  }

  .eyebrow {
    color: var(--brand-blue-dark);
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  h1 {
    color: var(--gray-900);
    font-size: clamp(34px, 5vw, 56px);
    line-height: 1.05;
    letter-spacing: 0;
    margin-bottom: 14px;
  }

  .subtitle {
    max-width: 700px;
    color: var(--gray-700);
    font-size: 18px;
  }

  .deck-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 18px;
  }

  .deck-card {
    display: flex;
    min-height: 210px;
    flex-direction: column;
    justify-content: space-between;
    color: inherit;
    text-decoration: none;
    background: var(--white);
    border: 1px solid var(--gray-200);
    border-radius: 8px;
    padding: 26px;
    box-shadow: 0 10px 28px rgba(17, 24, 39, 0.07);
    transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
  }

  .deck-card:hover,
  .deck-card:focus-visible {
    border-color: var(--brand-blue);
    box-shadow: 0 14px 34px rgba(62, 113, 184, 0.18);
    transform: translateY(-2px);
    outline: none;
  }

  .deck-label {
    color: var(--brand-blue-dark);
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .deck-title {
    color: var(--gray-900);
    font-size: 24px;
    font-weight: 900;
    line-height: 1.15;
    margin-bottom: 12px;
  }

  .deck-meta {
    color: var(--gray-500);
    font-size: 15px;
  }

  .deck-action {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--brand-blue-dark);
    font-size: 15px;
    font-weight: 800;
  }

  .deck-action::after {
    content: ">";
    color: var(--brand-gold);
    font-weight: 900;
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="eyebrow">All In Advertising</div>
    <h1>Content Services Decks</h1>
    <p class="subtitle">Available internal decks for the Content Services project.</p>
  </header>

  <section class="deck-grid" aria-label="Available decks">
    <a class="deck-card" href="./content-services-proposal/">
      <div>
        <div class="deck-label">Proposal</div>
        <div class="deck-title">SEO Content Services Proposal</div>
        <p class="deck-meta">C-level decision deck · May 2026</p>
      </div>
      <span class="deck-action">Open deck</span>
    </a>

    <a class="deck-card" href="./current-state-and-seo-manager-role/">
      <div>
        <div class="deck-label">Role Review</div>
        <div class="deck-title">Current State and SEO Manager Role</div>
        <p class="deck-meta">Internal role and operating model deck · June 2026</p>
      </div>
      <span class="deck-action">Open deck</span>
    </a>
  </section>
</main>
</body>
</html>
